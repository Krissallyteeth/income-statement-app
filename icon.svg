<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="upperJaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="lowerJaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#6e6e6e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#111"/>

  <!-- Open mouth interior (dark red) -->
  <rect x="8" y="40" width="84" height="20" rx="2" fill="#6b0000"/>
  <rect x="8" y="47" width="84" height="7" rx="1" fill="#4a0000"/>

  <!-- Upper jaw body -->
  <path d="M8,6 Q50,3 92,6 L88,42 Q50,46 12,42 Z" fill="url(#upperJaw)" stroke="#0d0d0d" stroke-width="1.5"/>
  <!-- Upper jaw surface highlight -->
  <path d="M10,6 Q50,4 90,6 L87,22 Q50,24 13,22 Z" fill="#8a8a8a" opacity="0.5"/>
  <!-- Crack lines -->
  <line x1="28" y1="10" x2="23" y2="40" stroke="#333" stroke-width="1.5"/>
  <line x1="63" y1="9"  x2="69" y2="39" stroke="#333" stroke-width="1.5"/>
  <line x1="48" y1="5"  x2="50" y2="28" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Upper teeth (6 teeth hanging into open mouth) -->
  <rect x="12" y="31" width="11" height="16" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="25" y="29" width="11" height="18" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="38" y="27" width="11" height="20" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="51" y="27" width="11" height="20" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="64" y="29" width="11" height="18" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="77" y="31" width="11" height="16" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Upper tooth highlights -->
  <rect x="13" y="31" width="3" height="14" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="26" y="29" width="3" height="16" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="39" y="27" width="3" height="18" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="52" y="27" width="3" height="18" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="65" y="29" width="3" height="16" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="78" y="31" width="3" height="14" rx="1.5" fill="rgba(255,255,255,0.5)"/>

  <!-- Lower jaw body -->
  <path d="M12,58 Q50,54 88,58 L92,94 Q50,97 8,94 Z" fill="url(#lowerJaw)" stroke="#0d0d0d" stroke-width="1.5"/>
  <!-- Lower jaw surface highlight -->
  <path d="M13,58 Q50,55 87,58 L87,70 Q50,68 13,70 Z" fill="#717171" opacity="0.7"/>
  <!-- Crack lines -->
  <line x1="26" y1="64" x2="22" y2="90" stroke="#333" stroke-width="1.5"/>
  <line x1="66" y1="63" x2="72" y2="89" stroke="#333" stroke-width="1.5"/>

  <!-- Lower teeth (6 teeth rising into open mouth) -->
  <rect x="12" y="53" width="11" height="13" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="25" y="52" width="11" height="14" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="38" y="51" width="11" height="15" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="51" y="51" width="11" height="15" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="64" y="52" width="11" height="14" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="77" y="53" width="11" height="13" rx="2.5" fill="#EEEADB" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Lower tooth highlights -->
  <rect x="13" y="53" width="3" height="11" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="26" y="52" width="3" height="12" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="39" y="51" width="3" height="13" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="52" y="51" width="3" height="13" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="65" y="52" width="3" height="12" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="78" y="53" width="3" height="11" rx="1.5" fill="rgba(255,255,255,0.5)"/>
</svg>
